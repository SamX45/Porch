<style>
:root{
  --paper:#EDF0F7; --panel:#FFFFFF; --ink:#141C33; --muted:#66708F; --line:#D9DEEC;
  --me:#2F4BFF; --me-ink:#FFFFFF; --danger:#D6402F; --wash:#E3E8F5; --ok:#1FA97A;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0E1325; --panel:#182039; --ink:#E9ECF8; --muted:#8E98BB; --line:#26305A; --me:#4C63FF; --danger:#FF7A69; --wash:#1E2748}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--me);outline-offset:2px}
.ic{display:inline-grid;place-items:center}
.mark{display:block;flex:none}
.dp{border-radius:50%;overflow:hidden;border:2.5px solid;background:var(--wash)}
.dp img{width:100%;height:100%;object-fit:cover;display:block}
.plain{background:none;border:0;padding:0;text-align:left}

/* shell */
.shell{display:flex;height:100dvh;max-width:1040px;margin:0 auto;position:relative}
@media (min-width:900px){.shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
aside{width:310px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.app{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.scrim{display:none}
@media (max-width:899px){
  aside{position:fixed;inset:0 auto 0 0;width:min(88vw,350px);z-index:30;transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.open aside{transform:none}
  body.open .scrim{display:block;position:fixed;inset:0;background:rgba(10,15,35,.5);z-index:25}
}
@media (min-width:900px){.menu{display:none!important}}

/* sidebar */
.s-head{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.logo-wrap{display:block;color:var(--ink)}
.logo-wrap .logo{height:100%;width:auto;display:block;overflow:visible}
.sheet .logo-wrap{margin:0 0 6px -4px}
.s-actions{display:flex;gap:8px;padding:0 16px 12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;border:1.5px solid var(--line);background:var(--paper);padding:8px 14px;font-weight:600;font-size:14px}
.pill.main{background:var(--me);border-color:var(--me);color:#fff}
.s-scroll{flex:1;overflow-y:auto;padding:0 8px 12px;min-height:0}
.s-sec{margin:16px 10px 6px;font:700 13px var(--display);color:var(--muted)}
.s-empty{margin:4px 10px;font-size:13.5px;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:14px;border:0;background:transparent;text-align:left}
.item:hover{background:var(--wash)}
.item.on{background:var(--wash)}
.item .tx{flex:1;min-width:0}
.item .nm{display:flex;align-items:center;gap:6px;font:700 15px var(--display)}
.item .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--me);color:#fff;font-size:12px;font-weight:700;min-width:22px;height:22px;border-radius:99px;display:grid;place-items:center;padding:0 6px}
.dot{position:relative}
.dot::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.dot.off::after{background:var(--line)}
.s-me{border-top:1px solid var(--line);padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
.s-me .sb{font-size:13px}

/* header */
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--wash)}
.rtitle{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:4px 6px;border-radius:14px;border:0;background:transparent;text-align:left}
.rtitle:hover{background:var(--wash)}
.rtitle h1{margin:0;font:800 19px/1.15 var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.rtitle p{margin:1px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtitle .tx{min-width:0}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.stack{display:flex;align-items:center;flex:none}
.stack>*{margin-left:-8px}
.stack>*:first-child{margin-left:0}
.seg{display:flex;gap:6px;padding:8px 14px;background:var(--paper)}
.seg button{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:5px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* messages */
#list{flex:1;overflow-y:auto;padding:10px 14px 8px;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain;scroll-behavior:smooth}
.day{align-self:center;margin:10px 0 12px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--wash);padding:3px 12px;border-radius:99px}
.pin{align-self:stretch;background:var(--wash);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:4px 0 14px}
.pin-h{font:700 12.5px var(--display);letter-spacing:.02em;color:var(--muted);margin-bottom:3px}
.pin-t{font-size:14px;line-height:1.4;white-space:pre-wrap}
.sys{align-self:center;margin:8px 0;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.row.other{align-self:flex-start}
.row.mine{align-self:flex-end;flex-direction:row-reverse}
.row.first{margin-top:12px}
.gutter{width:34px;flex:none;align-self:flex-start}
.col{display:flex;flex-direction:column;min-width:0}
.mine .col{align-items:flex-end}
.meta{font-size:12.5px;color:var(--muted);margin:0 4px 3px;display:flex;gap:8px;align-items:baseline}
.meta .namebtn{font:700 13.5px var(--display);color:var(--ink);background:none;border:0;padding:0;letter-spacing:-.005em}
.meta .namebtn:hover{text-decoration:underline}
.fol{font-size:11.5px;font-weight:600;color:var(--me)}
.bubble{padding:9px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap;text-align:left;max-width:100%}
.other .bubble{border-bottom-left-radius:6px}
.other.first .bubble{border-top-left-radius:6px}
.mine .bubble{background:var(--me);border-color:var(--me);color:var(--me-ink);border-bottom-right-radius:6px;cursor:pointer}
.mine .bubble.pending{opacity:.6}
.mine .bubble.failed{background:transparent;color:var(--ink);border:1.5px dashed var(--danger)}
.status{font-size:12.5px;margin:3px 4px 0;color:var(--muted);display:flex;gap:10px;align-items:center}
.status.err{color:var(--danger)}
.link{background:none;border:0;padding:6px 2px;font-weight:600;color:var(--me);text-decoration:underline;text-underline-offset:3px}
.link.del{color:var(--danger)}
.pop{animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.empty{margin:auto;text-align:center;max-width:290px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty h2{margin:8px 0 0;font:800 20px var(--display);color:var(--ink)}
.empty p{margin:0}
#jump{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#jump[hidden]{display:none}

/* composer */
footer{padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--paper)}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:24px;padding:6px 6px 6px 16px;transition:border-color .15s}
.box:focus-within{border-color:var(--me)}
.box.limited{border-color:var(--danger)}
textarea{flex:1;border:0;outline:0;background:transparent;resize:none;max-height:140px;padding:8px 0;line-height:1.4}
textarea::placeholder{color:var(--muted)}
#send{width:44px;height:44px;border-radius:50%;border:0;background:var(--me);color:#fff;display:grid;place-items:center;flex:none}
#send:disabled{background:var(--wash);color:var(--muted);cursor:not-allowed}
.hint{min-height:20px;margin:5px 14px 0;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.hint.err{color:var(--danger)}

/* sheets */
dialog{border:0;padding:0;background:transparent;width:100%;max-width:460px;margin:auto auto 0;color:var(--ink);overflow:visible}
@media (min-width:600px){dialog{margin:auto}}
dialog::backdrop{background:rgba(10,15,35,.55)}
.sheet{background:var(--panel);border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto;position:relative}
@media (min-width:600px){.sheet{border-radius:26px}}
.sheet h2{margin:0 0 4px;font:800 24px/1.1 var(--display);letter-spacing:-.02em;padding-right:44px}
.sheet .sub{margin:0 0 16px;color:var(--muted);font-size:14.5px}
.x{position:absolute;top:14px;right:14px}
.pv{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.pv strong{font:800 20px var(--display);overflow-wrap:anywhere}
label.f,.lg{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.in{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);outline:0}
.in:focus{border-color:var(--me)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pickrow{display:flex;gap:8px;flex-wrap:wrap}
.pk{position:relative}
.pk input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pk span{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--paper)}
.pk input:checked+span{border-color:var(--me);background:var(--wash)}
.pk input:focus-visible+span{outline:3px solid var(--me);outline-offset:2px}
.sw{width:22px;height:22px;border-radius:50%}
.go{width:100%;padding:14px;border:0;border-radius:16px;background:var(--me);color:#fff;font-weight:700;font-size:16px;margin-top:18px}
.go:disabled{background:var(--wash);color:var(--muted);cursor:not-allowed}
.go.ghost{background:transparent;color:var(--danger);border:1.5px solid var(--line);margin-top:10px}
.err{color:var(--danger);font-size:13.5px;margin:8px 0 0;min-height:0}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:14px;margin-top:8px;cursor:pointer;position:relative}
.opt:has(input:checked){border-color:var(--me);background:var(--wash)}
.opt input{margin-top:4px;accent-color:var(--me)}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:13px}
.fbtn{border:1.5px solid var(--me);background:var(--me);color:#fff;border-radius:99px;padding:9px 22px;font-weight:700;min-width:120px}
.fbtn.on{background:transparent;color:var(--me)}
.fbtn.sm{padding:6px 14px;min-width:0;font-size:13.5px}
.ubig{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding-top:6px}
.ubig h2{padding:0;margin:10px 0 0}
.tag{font-size:12.5px;font-weight:600;background:var(--wash);border-radius:99px;padding:2px 10px;color:var(--muted)}
.bio{margin:6px 0 0;max-width:300px}
.stats{display:flex;gap:28px;margin:14px 0 4px}
.stats div{text-align:center}
.stats b{display:block;font:800 20px var(--display)}
.stats span{font-size:13px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.mrow .tx{flex:1;min-width:0}
.mrow .nm{font:700 15px var(--display)}
.mrow .sb{font-size:13px;color:var(--muted)}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px dashed var(--line);border-radius:14px;padding:10px 14px;margin-top:8px}
.code b{font:800 22px var(--display);letter-spacing:.14em}

@media (prefers-reduced-motion:reduce){#list{scroll-behavior:auto}.pop{animation:none}aside{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <aside id="side" aria-label="Rooms and people"></aside>
  <div class="scrim" id="scrim"></div>

  <div class="app">
    <header>
      <button class="iconbtn menu" id="menuBtn" aria-label="Open rooms"></button>
      <button class="rtitle" id="roomBtn" aria-label="Room details"></button>
      <button class="stack plain" id="people" aria-label="See who is here"></button>
    </header>
    <div class="seg" role="group" aria-label="Filter messages">
      <button id="fAll" aria-pressed="true">Everyone</button>
      <button id="fFol" aria-pressed="false">Following</button>
    </div>
    <main id="list" aria-live="polite" aria-label="Messages"></main>
    <button id="jump" hidden></button>
    <footer>
      <div class="box" id="box">
        <textarea id="input" rows="1" maxlength="500" aria-label="Message"></textarea>
        <button id="send" aria-label="Send message" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="hint" id="hint"><span id="hintText"></span><span id="counter"></span></div>
    </footer>
  </div>
</div>

<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>

function readDp(file){
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith("image/")) return rej(new Error("type"));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement("canvas");
      c.width = c.height = MAX_DP;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, MAX_DP, MAX_DP);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("load")); };
    img.src = url;
  });
}

/* ---- turn a database row into the shape the UI already expects ---- */
function mapRoom(r){ return {id:r.id, name:r.name, desc:r.description, shape:r.shape, color:r.color, vis:r.visibility, code:r.invite_code, owner:r.owner_id, fixed: r.owner_id === null, rules:r.rules || ""}; }
function mapProfile(p){ return {id:p.id, name:p.name, bio:p.bio, shape:p.shape, color:p.color, dp:p.avatar_url || null}; }
function mapMessage(m){ return {id:m.id, roomId:m.room_id, uid:m.sender_id, text:m.text, ts:new Date(m.created_at).getTime(), status:"sent"}; }
function cacheProfile(p){ users.set(p.id, mapProfile(p)); }
async function ensureProfile(id){
  if (users.has(id)) return users.get(id);
  const {data} = await sb.from("profiles").select("*").eq("id", id).maybeSingle();
  if (data){ cacheProfile(data); return users.get(id); }
  return null;
}
async function loadMessages(id){
  const {data, error} = await sb.from("messages").select("*").eq("room_id", id).order("created_at", {ascending:true}).limit(100);
  if (error){ msgs[id] = msgs[id] || []; return; }
  const missing = [...new Set(data.map(m => m.sender_id))].filter(x => !users.has(x));
  if (missing.length){ const {data:profs} = await sb.from("profiles").select("*").in("id", missing); (profs || []).forEach(cacheProfile); }
  msgs[id] = data.map(mapMessage);
}
async function loadMembers(id){
  const {data, error} = await sb.from("room_members").select("user_id, role, profiles(*)").eq("room_id", id);
  if (error){ presence[id] = presence[id] || new Set(); roles[id] = roles[id] || new Map(); return; }
  presence[id] = new Set(data.map(row => row.user_id));
  roles[id] = new Map(data.map(row => [row.user_id, row.role]));
  data.forEach(row => { if (row.profiles) cacheProfile(row.profiles); });
}
function myRoleIn(id){
  const rm = room(id);
  if (!rm || !me) return null;
  if (rm.owner === me.id) return "owner";
  const m = roles[id]; if (!m) return null;
  return m.get(me.id) || "member";
}
function canModerate(id){ const r = myRoleIn(id); return r === "owner" || r === "admin"; }
let channelGen = 0; // every resubscribe() call gets its own number; only the newest one's events are ever acted on
async function resubscribe(){
  const myGen = ++channelGen;
  const old = msgChannel; msgChannel = null;
  if (old) await sb.removeChannel(old); // wait for the old connection to actually close
  if (myGen !== channelGen) return;     // a newer resubscribe() started while we were waiting — let that one win
  const ids = [...joined];
  if (!ids.length) return;
  const stillCurrent = () => myGen === channelGen; // belt-and-suspenders: even if the old channel's
                                                     // close is slow or never confirms, a stale channel's
                                                     // own callbacks refuse to act once superseded
  const ch = sb.channel("porch-messages-" + myGen)
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"messages", filter:`room_id=in.(${ids.join(",")})`}, async payload => {
      if (!stillCurrent()) return;
      const row = payload.new;
      const arr = msgs[row.room_id] || (msgs[row.room_id] = []);
      if (arr.some(x => x.id === row.id)) return; // the REST response for our own send already placed this exact row
      const mapped = mapMessage(row);
      // our own message might still be sitting as an unconfirmed "sending" placeholder —
      // upgrade it in place instead of adding a second copy, whichever arrives first
      const pendingIdx = arr.findIndex(x => typeof x.id === "string" && x.id.startsWith("tmp-") && x.uid === row.sender_id && x.text === row.text);
      if (pendingIdx > -1){ mapped.clientId = arr[pendingIdx].id; arr[pendingIdx] = mapped; }
      else arr.push(mapped);
      await ensureProfile(row.sender_id);
      if (stillCurrent()) chat.emit({type:"message", msg:mapped});
    })
    .on("postgres_changes", {event:"DELETE", schema:"public", table:"messages", filter:`room_id=in.(${ids.join(",")})`}, payload => {
      if (!stillCurrent()) return;
      const row = payload.old, a = msgs[row.room_id];
      if (a){ const i = a.findIndex(x => x.id === row.id); if (i > -1) a.splice(i, 1); }
      chat.emit({type:"remove", roomId:row.room_id});
    })
    .subscribe();
  if (myGen === channelGen) msgChannel = ch; else sb.removeChannel(ch);
}

/* ============ data layer: every method here is a real call to Supabase ============ */
const chat = {
  subs: new Set(),
  subscribe(fn){ this.subs.add(fn); },
  emit(e){ this.subs.forEach(fn => fn(e)); },
  async send(m){
    const {data, error} = await sb.from("messages").insert({room_id:m.roomId, sender_id:me.id, text:m.text}).select().single();
    if (error) throw error;
    return mapMessage(data);
  },
  async remove(m){
    const {error} = await sb.from("messages").delete().eq("id", m.id);
    if (error) throw error;
    const a = msgs[m.roomId]; const i = a.findIndex(x => x.id === m.id); if (i > -1) a.splice(i, 1);
    this.emit({type:"remove", roomId:m.roomId});
  },
  async saveProfile(u){
    let avatar_url = u.dp;
    if (u.dp && u.dp.startsWith("data:")){
      const blob = await (await fetch(u.dp)).blob();
      const path = `${me.id}/avatar.jpg`;
      const {error:upErr} = await sb.storage.from("avatars").upload(path, blob, {upsert:true, contentType:"image/jpeg"});
      if (upErr) throw upErr;
      const {data:pub} = sb.storage.from("avatars").getPublicUrl(path);
      avatar_url = pub.publicUrl + "?t=" + Date.now(); // cache-bust so a changed photo shows immediately
    } else if (!u.dp){
      avatar_url = null;
    }
    const {error} = await sb.from("profiles").update({name:u.name, bio:u.bio, shape:u.shape, color:u.color, avatar_url}).eq("id", me.id);
    if (error) throw error;
    me = {id:me.id, name:u.name, bio:u.bio, shape:u.shape, color:u.color, dp:avatar_url};
    users.set(me.id, me);
    this.emit({type:"profile"});
  },
  async follow(userId, on){
    if (on){
      const {error} = await sb.from("follows").insert({follower_id:me.id, followee_id:userId});
      if (error && error.code !== "23505") throw error; // 23505 = already following, fine
      follows.add(userId);
    } else {
      const {error} = await sb.from("follows").delete().eq("follower_id", me.id).eq("followee_id", userId);
      if (error) throw error;
      follows.delete(userId);
    }
    this.emit({type:"social"});
  },
  async createRoom(r){
    const {data, error} = await sb.from("rooms").insert({
      name:r.name, description:r.desc, shape:r.shape, color:r.color, visibility:r.vis,
      invite_code: r.vis === "private" ? r.code : null, owner_id: me.id, rules: r.rules || ""
    }).select().single();
    if (error) throw error;
    const mapped = mapRoom(data);
    const {error:joinErr} = await sb.from("room_members").insert({room_id:mapped.id, user_id:me.id});
    if (joinErr) throw joinErr;
    rooms.push(mapped); msgs[mapped.id] = []; joined.add(mapped.id);
    await loadMembers(mapped.id);
    resubscribe(); this.emit({type:"rooms"});
    return mapped;
  },
  async setRole(roomId, userId, role){
    const {error} = await sb.from("room_members").update({role}).eq("room_id", roomId).eq("user_id", userId);
    if (error) throw error;
    await loadMembers(roomId);
    this.emit({type:"rooms"});
  },
  async kickMember(roomId, userId){
    const {error} = await sb.from("room_members").delete().eq("room_id", roomId).eq("user_id", userId);
    if (error) throw error;
    await loadMembers(roomId);
    this.emit({type:"rooms"});
  },
  async joinRoom(id){
    const {error} = await sb.from("room_members").insert({room_id:id, user_id:me.id});
    if (error && error.code !== "23505") throw error;
    joined.add(id); msgs[id] = msgs[id] || [];
    await loadMembers(id);
    resubscribe(); this.emit({type:"rooms"});
  },
  async joinRoomWithCode(code){
    const {data, error} = await sb.rpc("join_room_with_code", {code});
    if (error) throw new Error(error.message || "No room matches that code.");
    const mapped = mapRoom(data);
    if (!room(mapped.id)) rooms.push(mapped);
    msgs[mapped.id] = msgs[mapped.id] || []; joined.add(mapped.id);
    await loadMembers(mapped.id);
    resubscribe(); this.emit({type:"rooms"});
    return mapped;
  },
  async leaveRoom(id){
    const {error} = await sb.from("room_members").delete().eq("room_id", id).eq("user_id", me.id);
    if (error) throw error;
    joined.delete(id); resubscribe(); this.emit({type:"rooms"});
  },
  async deleteRoom(id){
    const {error} = await sb.from("rooms").delete().eq("id", id);
    if (error) throw error;
    rooms = rooms.filter(r => r.id !== id); joined.delete(id); delete msgs[id]; delete presence[id];
    resubscribe(); this.emit({type:"rooms"});
  }
};

function renderChat(newId){
  if (!roomId || !cur()) return;
  list.replaceChildren();
  const room0 = cur();
  if (filter === "all" && room0.rules) list.append(h("div", {class:"pin"}, h("div", {class:"pin-h"}, "📌 Welcome Mat"), h("div", {class:"pin-t"}, room0.rules)));
  let arr = msgs[roomId] || [];
  if (filter === "following") arr = arr.filter(m => !m.system && (m.uid === (me && me.id) || follows.has(m.uid)));
  if (!arr.length){
    const r = cur(), e = h("div", {class:"empty"});
    if (filter === "following"){
      e.append(mark("circle", "#66708F", 40), h("h2", {}, "Nothing from people you follow"), h("p", {}, "Tap a name in the room to open a profile and follow them. Their messages will show up here."));
    } else {
      e.append(mark(r.shape, r.color, 44), h("h2", {}, "The room is quiet"), h("p", {}, r.vis === "private" && r.owner === (me && me.id) ? `Send the first message, then share the code ${r.code} to invite people.` : "Send the first message and say hello."));
    }
    list.append(e); return;
  }
  let prev = null;
  arr.forEach(m => {
    if (!prev || dayKey(prev.ts) !== dayKey(m.ts)) list.append(h("div", {class:"day"}, dayLabel(m.ts)));
    if (m.system){ list.append(h("div", {class:"sys"}, m.text)); prev = m; return; }
    const u = users.get(m.uid) || {id:m.uid, name:"Someone", shape:"circle", color:"#8E98BB"};
    const mine = me && m.uid === me.id;
    const grouped = prev && !prev.system && prev.uid === m.uid && m.ts - prev.ts < 180000 && dayKey(prev.ts) === dayKey(m.ts);
    const row = h("div", {class:`row ${mine ? "mine" : "other"}${grouped ? "" : " first"}${newId === m.id ? " pop" : ""}`});
    if (!mine){
      const g = h("div", {class:"gutter"});
      if (!grouped) g.append(h("button", {class:"plain", type:"button", "aria-label":"View " + u.name, onclick: () => userSheet(u)}, avatar(u, 34)));
      row.append(g);
    }
    const col = h("div", {class:"col"});
    if (!grouped) col.append(h("div", {class:"meta"},
      mine ? h("b", {style:"font:700 13.5px var(--display);color:var(--ink)"}, "You") : h("button", {class:"namebtn", type:"button", onclick: () => userSheet(u)}, u.name),
      !mine && follows.has(u.id) ? h("span", {class:"fol"}, "Following") : null,
      h("span", {}, fmtTime(m.ts))));
    const canRemoveThis = mine || canModerate(roomId);
    const b = h("div", {class:"bubble" + (m.status === "sending" ? " pending" : "") + (m.status === "failed" ? " failed" : "")}, m.text);
    if (canRemoveThis && m.status !== "failed"){
      b.tabIndex = 0; b.setAttribute("role", "button"); b.setAttribute("aria-label", "Press for options.");
      const tg = () => { selectedId = selectedId === m.id ? null : m.id; renderChat(); };
      b.addEventListener("click", tg);
      b.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); tg(); } });
    }
    col.append(b);
    if (m.status === "failed"){
      col.append(h("div", {class:"status err"}, "Not sent.",
        h("button", {class:"link", type:"button", onclick: () => retrySend(m)}, "Retry"),
        h("button", {class:"link del", type:"button", onclick: () => { const a = msgs[m.roomId]; a.splice(a.indexOf(m), 1); renderChat(); }}, "Discard")));
    } else if (canRemoveThis && selectedId === m.id){
      col.append(h("div", {class:"status"}, h("button", {class:"link del", type:"button", onclick: () => { selectedId = null; chat.remove(m); }}, mine ? "Delete message" : "Remove message")));
    }
    row.append(col); list.append(row); prev = m;
  });
}

/* ============ events ============ */
chat.subscribe(e => {
  if (e.type === "message"){
    const a = msgs[e.msg.roomId] || (msgs[e.msg.roomId] = []); if (a.length > 200) a.shift();
    if (e.msg.roomId === roomId){
      const stick = nearBottom(), mineMsg = me && e.msg.uid === me.id;
      renderChat(e.msg.id);
      if (stick || mineMsg) toBottom();
      else { unseen++; const j = $("#jump"); j.textContent = unseen === 1 ? "1 new message" : unseen + " new messages"; j.hidden = false; }
    } else if (joined.has(e.msg.roomId) && !e.msg.system && !(me && e.msg.uid === me.id)) unread[e.msg.roomId] = (unread[e.msg.roomId] || 0) + 1;
    renderSide();
  }
  if (e.type === "remove"){ renderChat(); renderSide(); }
  if (e.type === "presence"){ renderHeader(); renderSide(); }
  if (e.type === "social"){ renderSide(); renderChat(); }
  if (e.type === "profile"){ renderSide(); renderHeader(); renderChat(); }
  if (e.type === "rooms"){ if (!joined.has(roomId) || !room(roomId)) switchRoom(defaultRoomId); else { renderSide(); renderHeader(); } }
});

async function switchRoom(id){
  if (!id || !room(id) || !joined.has(id)) return;
  roomId = id; filter = "all"; selectedId = null; unread[id] = 0;
  renderSide(); renderHeader(); closeDrawer();
  if (!msgs[id] || !msgs[id].length) await loadMessages(id);
  if (roomId === id){ renderHeader(); renderChat(); toBottom(false); }
}
$("#fAll").onclick = () => { filter = "all"; renderHeader(); renderChat(); toBottom(false); };
$("#fFol").onclick = () => { filter = "following"; renderHeader(); renderChat(); };

/* ============ composer ============ */
const input = $("#input"), sendBtn = $("#send"), box = $("#box");
function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
function hint(t, err){ $("#hintText").textContent = t || ""; $("#hint").classList.toggle("err", !!err); box.classList.toggle("limited", !!err); }
function cooldownLeft(){
  const now = Date.now(); sentTimes = sentTimes.filter(t => now - t < BURST.seconds * 1000);
  return sentTimes.length < BURST.count ? 0 : Math.ceil((sentTimes[0] + BURST.seconds * 1000 - now) / 1000);
}
function tickCooldown(){
  clearInterval(cooldownTimer);
  const up = () => { const s = cooldownLeft(); if (s > 0){ hint(`Slow down. You can send again in ${s}s.`, true); sendBtn.disabled = true; } else { hint(""); clearInterval(cooldownTimer); syncSend(); } };
  up(); cooldownTimer = setInterval(up, 500);
}
function syncSend(){ sendBtn.disabled = !input.value.trim() || cooldownLeft() > 0 || !me; }
input.addEventListener("input", () => { autosize(); syncSend(); const left = MAX_LEN - input.value.length; $("#counter").textContent = left <= 100 ? left + " left" : ""; });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !coarse){ e.preventDefault(); submit(); } });
sendBtn.addEventListener("click", submit);
async function submit(){
  const text = input.value.trim(); if (!text || !me || !roomId) return;
  if (cooldownLeft() > 0){ tickCooldown(); return; }
  sentTimes.push(Date.now());
  const m = {id:"tmp-" + uid(), roomId, uid:me.id, text, ts:Date.now(), status:"sending"};
  input.value = ""; autosize(); $("#counter").textContent = ""; syncSend();
  filter = "all"; renderHeader();
  msgs[roomId].push(m); renderChat(m.id); renderSide(); toBottom();
  if (cooldownLeft() > 0) tickCooldown();
  await deliver(m);
}
async function deliver(m){
  const a = msgs[m.roomId];
  try{
    const saved = await chat.send(m);     // saved.id is the real database id
    saved.clientId = m.id;                // lets a later-arriving realtime echo recognise this row as already placed
    const i = a.findIndex(x => x.id === m.id || x.clientId === m.id);
    if (i > -1) a[i] = saved; else a.push(saved);
  }catch{
    m.status = "failed";
  }
  if (m.roomId === roomId) renderChat();
  renderSide();
}
function retrySend(m){ m._retried = true; m.status = "sending"; renderChat(); deliver(m); }

function shapePicker(state, onChange){
  const sRow = h("div", {class:"pickrow"}), cRow = h("div", {class:"pickrow"});
  const build = () => {
    sRow.replaceChildren(...Object.keys(SHAPES).map(k => h("label", {class:"pk"},
      h("input", {type:"radio", name:"shape", value:k, checked: state.shape === k, "aria-label":k, onchange: () => { state.shape = k; onChange(); }}),
      h("span", {}, mark(k, state.color, 26)))));
    cRow.replaceChildren(...COLORS.map(c => h("label", {class:"pk"},
      h("input", {type:"radio", name:"color", value:c, checked: state.color === c, "aria-label":"colour " + c, onchange: () => { state.color = c; build(); onChange(); }}),
      h("span", {}, h("div", {class:"sw", style:"background:" + c})))));
  };
  build(); return {sRow, cRow};
}

    h("p", {}, r.desc),
    r.rules ? [h("div", {class:"lg"}, "Welcome Mat"), h("p", {}, r.rules)] : null,
    r.vis === "private" && r.code ? [h("div", {class:"lg"}, "Invite code"), h("div", {class:"code"}, h("b", {}, r.code), copyBtn), h("p", {class:"note"}, "Anyone with this code can join. Share it only with people you trust.")] : null,
    h("div", {class:"lg"}, `Members (${members.length})`),
    members.map(memberRow),
    actions));
}

/* ============ boot: sign in, load real data from Supabase ============ */
async function enterRoom(){
  if (defaultRoomId && !joined.has(defaultRoomId)) await chat.joinRoom(defaultRoomId);
  await switchRoom(defaultRoomId);
  syncSend(); input.focus();
}
function fatalError(msg, retry){
  list.replaceChildren(h("div", {class:"empty"}, mark("circle", "#D6402F", 40), h("h2", {}, "Couldn't connect"),
    h("p", {}, msg), h("button", {class:"go", type:"button", style:"max-width:220px", onclick:retry}, "Retry")));
}
let myIsAnonymous = true; // false once the account is linked to a real Google identity
// Runs once we have a real signed-in user — either a returning visitor's
// restored session, or someone who just finished the join form for the
// first time. Loads everything their account can see.
async function loadSignedInUser(authUser, isFirstTime){
  const authId = authUser.id;
  // The cached session token can still claim "anonymous" for a while right after
  // linking a Google identity, even though the database already updated — so ask
  // the server directly rather than trusting the locally-stored claim.
  try{
    const {data:{user:freshUser}} = await sb.auth.getUser();
    myIsAnonymous = (freshUser || authUser).is_anonymous !== false;
  }catch{
    myIsAnonymous = authUser.is_anonymous !== false;
  }
  let prof = (await sb.from("profiles").select("*").eq("id", authId).maybeSingle()).data;
  if (!prof){ await sleep(500); prof = (await sb.from("profiles").select("*").eq("id", authId).maybeSingle()).data; }
  if (!prof) throw new Error("profile not ready");
  me = mapProfile(prof); users.set(me.id, me);

  const {data:roomRows} = await sb.from("rooms").select("*").order("created_at", {ascending:true});
  rooms = (roomRows || []).map(mapRoom);
  defaultRoomId = (rooms.find(r => r.fixed) || rooms[0] || {}).id || null;
  rooms.forEach(r => { msgs[r.id] = msgs[r.id] || []; });

  const {data:memberRows} = await sb.from("room_members").select("room_id").eq("user_id", me.id);
  joined = new Set((memberRows || []).map(r => r.room_id));

  await Promise.all(rooms.map(r => loadMembers(r.id)));

  const {data:followRows} = await sb.from("follows").select("followee_id").eq("follower_id", me.id);
  follows = new Set((followRows || []).map(r => r.followee_id));
  const missing = [...follows].filter(id => !users.has(id));
  if (missing.length){ const {data:fp} = await sb.from("profiles").select("*").in("id", missing); (fp || []).forEach(cacheProfile); }

  ready = true;
  resubscribe();
  return isFirstTime || prof.name === "New user";
}
async function init(){
  list.replaceChildren(h("div", {class:"empty"}, logo(40), h("h2", {}, "Loading…")));
  side.replaceChildren(h("div", {class:"s-head"}, logo(54)));
  try{
    const {data:{session:existing}} = await sb.auth.getSession();
    if (!existing){
      // Nobody's account exists yet. Show the join sheet WITHOUT creating
      // one — an account is only created once they actually submit it, in
      // createAccountAndJoin() below. Just looking at the page should never
      // leave a row in the database.
      side.replaceChildren(h("div", {class:"s-head"}, logo(54)));
      profileSheet(true);
      return;
    }
    // if they just came back from a Google sign-in, this IS their first real
    // session even though one "exists" now — the trigger only just created
    // their profile, so prof.name will still read "New user" and the usual
    // needsProfile check below sends them to the join sheet to pick a name.
    const needsProfile = await loadSignedInUser(existing.user, false);
    if (needsProfile){ renderSide(); profileSheet(true); return; }
    roomId = joined.has(defaultRoomId) ? defaultRoomId : [...joined][0] || null;
    if (!roomId && defaultRoomId){ await chat.joinRoom(defaultRoomId); roomId = defaultRoomId; }
    if (roomId) await loadMessages(roomId);
    renderSide(); renderHeader(); renderChat(); toBottom(false); syncSend();
  }catch(err){
    fatalError("Check your connection and try again.", init);
  }
}
// Called from the join form the very first time someone submits it. This is
// the one moment a new ANONYMOUS account is allowed to be created.
async function createAccountAndJoin(){
  const {data, error} = await sb.auth.signInAnonymously();
  if (error) throw error;
  await loadSignedInUser(data.session.user, true);
}
// Continuing with Google when there's no session yet (or the person chose
// Google instead of "Continue as guest"). This navigates away to Google and
// back — nothing after this call runs until the page reloads.
async function signInWithGoogle(){
  const {error} = await sb.auth.signInWithOAuth({provider:"google", options:{redirectTo: location.href}});
  if (error) throw error;
}
// Upgrading an EXISTING anonymous account to a real Google identity, keeping
// the same profile, rooms and messages — nothing is lost or recreated.
async function connectGoogle(){
  const {error} = await sb.auth.linkIdentity({provider:"google", options:{redirectTo: location.href}});
  if (error) throw error;
}
init();
</script>
